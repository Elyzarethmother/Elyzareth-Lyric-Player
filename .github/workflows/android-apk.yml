
name: Build Elyzareth Lyric Player Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Prepare build environment
        run: |
          # Make the Gradle wrapper executable, if the repository has one.
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

          # Create .env from the example only if the project uses one.
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "ERROR: Gradle wrapper (gradlew) is missing."
            echo "Commit the project's Gradle wrapper files, then rerun this workflow."
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyzareth-Lyric-Player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
